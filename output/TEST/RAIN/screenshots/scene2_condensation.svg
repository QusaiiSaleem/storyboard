<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
    <defs>
        <!-- Fonts -->
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&amp;display=swap');
            text {
                font-family: 'Tajawal', sans-serif;
            }
        </style>

        <!-- Background Gradient -->
        <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F8FAFE" />
            <stop offset="100%" stop-color="#EEF2F7" />
        </linearGradient>

        <!-- Card Gradient -->
        <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1a3a6e" />
            <stop offset="100%" stop-color="#2563a8" />
        </linearGradient>

        <!-- Drop Shadows -->
        <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
            <feOffset dx="0" dy="8" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.15" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
            <feOffset dx="0" dy="4" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.25" />
            </feComponentTransfer>
            <feFlood flood-color="#0288d1" />
            <feComposite in2="offsetblur" operator="in" />
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <filter id="glow-line" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <!-- Arrowhead Marker -->
        <marker id="arrow" markerWidth="16" markerHeight="16" refX="14" refY="8" markerUnits="userSpaceOnUse" orient="auto">
            <path d="M 4 2 L 14 8 L 4 14 L 6 8 Z" fill="#0288d1" />
        </marker>

        <!-- Dot Pattern for Background -->
        <pattern id="dotGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.5" fill="#1a3a6e" opacity="0.04" />
        </pattern>
    </defs>

    <!-- Base Background -->
    <rect width="1280" height="720" fill="url(#bg-gradient)" />
    <rect width="1280" height="720" fill="url(#dotGrid)" />

    <!-- Ambient Atmospheric Background Shapes -->
    <circle cx="1100" cy="100" r="400" fill="#2563a8" opacity="0.03" />
    <circle cx="150" cy="650" r="350" fill="#0288d1" opacity="0.03" />

    <!-- Floating Particles for Cinematic Vibe -->
    <g fill="#0288d1" opacity="0.3">
        <circle cx="200" cy="550" r="3" />
        <circle cx="1050" cy="200" r="4" />
        <circle cx="850" cy="600" r="2.5" />
        <circle cx="450" cy="150" r="3" />
        <circle cx="650" cy="500" r="2" />
        <circle cx="100" cy="300" r="3.5" />
    </g>

    <!-- Header Section -->
    <g text-anchor="middle" direction="rtl">
        <!-- Subtitle Badge -->
        <rect x="580" y="45" width="120" height="26" rx="13" fill="#e0f0ff" />
        <text x="640" y="63" font-size="12" font-weight="bold" fill="#0288d1">نظام دورة المياه</text>
        
        <!-- Main Title -->
        <text x="640" y="115" font-size="28" font-weight="bold" fill="#1a3a6e">مراحل الصعود والتكاثف</text>
        
        <!-- Title Accent Line -->
        <line x1="610" y1="135" x2="670" y2="135" stroke="#0288d1" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- ============================================== -->
    <!-- PIPELINE CONNECTIONS (Drawn Behind Cards)      -->
    <!-- ============================================== -->

    <g fill="none">
        <!-- Glows -->
        <path d="M 965 450 Q 930 450, 930 400 T 895 350" stroke="#0288d1" stroke-width="12" opacity="0.1" filter="url(#glow-line)" />
        <path d="M 675 350 Q 640 350, 640 400 T 605 450" stroke="#0288d1" stroke-width="12" opacity="0.1" filter="url(#glow-line)" />
        <path d="M 385 450 Q 350 450, 350 400 T 315 350" stroke="#0288d1" stroke-width="12" opacity="0.1" filter="url(#glow-line)" />

        <!-- Solid Flow Lines with Arrows -->
        <path d="M 965 450 Q 930 450, 930 400 T 895 350" stroke="#0288d1" stroke-width="3" marker-end="url(#arrow)" />
        <path d="M 675 350 Q 640 350, 640 400 T 605 450" stroke="#0288d1" stroke-width="3" marker-end="url(#arrow)" />
        <path d="M 385 450 Q 350 450, 350 400 T 315 350" stroke="#0288d1" stroke-width="3" marker-end="url(#arrow)" />
    </g>

    <!-- Flow Nodes at the start of each arrow -->
    <g>
        <!-- Node 1 -->
        <circle cx="965" cy="450" r="5" fill="#0288d1" />
        <circle cx="965" cy="450" r="9" fill="none" stroke="#0288d1" stroke-width="2" opacity="0.5" />
        
        <!-- Node 2 -->
        <circle cx="675" cy="350" r="5" fill="#0288d1" />
        <circle cx="675" cy="350" r="9" fill="none" stroke="#0288d1" stroke-width="2" opacity="0.5" />
        
        <!-- Node 3 -->
        <circle cx="385" cy="450" r="5" fill="#0288d1" />
        <circle cx="385" cy="450" r="9" fill="none" stroke="#0288d1" stroke-width="2" opacity="0.5" />
    </g>


    <!-- ============================================== -->
    <!-- STEP 1 (Rightmost)                             -->
    <!-- ============================================== -->
    <g>
        <!-- Card Body -->
        <rect x="965" y="360" width="220" height="180" rx="15" fill="url(#card-grad)" filter="url(#card-shadow)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
        
        <!-- Inner Decorative Geometry -->
        <circle cx="1075" cy="450" r="60" fill="#ffffff" opacity="0.03" />
        <path d="M 1075 390 L 1125 420 L 1125 480 L 1075 510 L 1025 480 L 1025 420 Z" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.04" />

        <!-- Floating Badge -->
        <circle cx="1075" cy="360" r="24" fill="#ffffff" filter="url(#badge-shadow)" />
        <text x="1075" y="368" font-size="22" font-weight="bold" fill="#1a3a6e" text-anchor="middle">١</text>

        <!-- Card Content -->
        <text x="1075" y="415" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" direction="rtl">البخار يرتفع</text>
        <line x1="1035" y1="435" x2="1115" y2="435" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" />
        
        <text font-size="13" fill="#ffffff" opacity="0.9" text-anchor="middle" direction="rtl">
            <tspan x="1075" y="465">الهواء الدافئ يحمل</tspan>
            <tspan x="1075" y="485">البخار للأعلى</tspan>
        </text>
    </g>


    <!-- ============================================== -->
    <!-- STEP 2                                         -->
    <!-- ============================================== -->
    <g>
        <!-- Card Body -->
        <rect x="675" y="260" width="220" height="180" rx="15" fill="url(#card-grad)" filter="url(#card-shadow)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
        
        <!-- Inner Decorative Geometry -->
        <circle cx="785" cy="350" r="60" fill="#ffffff" opacity="0.03" />
        <path d="M 785 290 L 835 320 L 835 380 L 785 410 L 735 380 L 735 320 Z" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.04" />

        <!-- Floating Badge -->
        <circle cx="785" cy="260" r="24" fill="#ffffff" filter="url(#badge-shadow)" />
        <text x="785" y="268" font-size="22" font-weight="bold" fill="#1a3a6e" text-anchor="middle">٢</text>

        <!-- Card Content -->
        <text x="785" y="315" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" direction="rtl">التبريد</text>
        <line x1="745" y1="335" x2="825" y2="335" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" />
        
        <text font-size="13" fill="#ffffff" opacity="0.9" text-anchor="middle" direction="rtl">
            <tspan x="785" y="365">تنخفض الحرارة</tspan>
            <tspan x="785" y="385">مع الارتفاع</tspan>
        </text>
    </g>


    <!-- ============================================== -->
    <!-- STEP 3                                         -->
    <!-- ============================================== -->
    <g>
        <!-- Card Body -->
        <rect x="385" y="360" width="220" height="180" rx="15" fill="url(#card-grad)" filter="url(#card-shadow)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
        
        <!-- Inner Decorative Geometry -->
        <circle cx="495" cy="450" r="60" fill="#ffffff" opacity="0.03" />
        <path d="M 495 390 L 545 420 L 545 480 L 495 510 L 445 480 L 445 420 Z" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.04" />

        <!-- Floating Badge -->
        <circle cx="495" cy="360" r="24" fill="#ffffff" filter="url(#badge-shadow)" />
        <text x="495" y="368" font-size="22" font-weight="bold" fill="#1a3a6e" text-anchor="middle">٣</text>

        <!-- Card Content -->
        <text x="495" y="415" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" direction="rtl">التكاثف</text>
        <line x1="455" y1="435" x2="535" y2="435" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" />
        
        <text font-size="13" fill="#ffffff" opacity="0.9" text-anchor="middle" direction="rtl">
            <tspan x="495" y="465">البخار يتحول</tspan>
            <tspan x="495" y="485">لقطيرات مائية</tspan>
        </text>
    </g>


    <!-- ============================================== -->
    <!-- STEP 4 (Leftmost)                              -->
    <!-- ============================================== -->
    <g>
        <!-- Card Body -->
        <rect x="95" y="260" width="220" height="180" rx="15" fill="url(#card-grad)" filter="url(#card-shadow)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
        
        <!-- Inner Decorative Geometry -->
        <circle cx="205" cy="350" r="60" fill="#ffffff" opacity="0.03" />
        <path d="M 205 290 L 255 320 L 255 380 L 205 410 L 155 380 L 155 320 Z" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.04" />

        <!-- Floating Badge -->
        <circle cx="205" cy="260" r="24" fill="#ffffff" filter="url(#badge-shadow)" />
        <text x="205" y="268" font-size="22" font-weight="bold" fill="#1a3a6e" text-anchor="middle">٤</text>

        <!-- Card Content -->
        <text x="205" y="315" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle" direction="rtl">نواة التكثيف</text>
        <line x1="165" y1="335" x2="245" y2="335" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" />
        
        <text font-size="13" fill="#ffffff" opacity="0.9" text-anchor="middle" direction="rtl">
            <tspan x="205" y="365">القطيرات تلتصق</tspan>
            <tspan x="205" y="385">بجزيئات الغبار</tspan>
        </text>
    </g>

</svg>